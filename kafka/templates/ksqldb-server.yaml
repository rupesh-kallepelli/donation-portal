apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksqldb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksqldb
  template:
    metadata:
      labels:
        app: ksqldb
    spec:
      containers:
        - name: ksqldb
          image: confluentinc/ksqldb-server:0.29.0
          ports:
            - containerPort: 8088
          env:
            - name: KSQL_KSQL_SERVICE_ID
              value: "ksql-service"
            - name: KSQL_LISTENER
              value: "http://0.0.0.0:8088"
            - name: KSQL_CONFIG_DIR
              value: "/tmp/ksqldb/config"
            - name: KSQL_LOG_DIR
              value: "/tmp/ksqldb/logs"
          volumeMounts:
            - name: config-volume
              mountPath: /tmp/ksqldb/config
            - name: logs-volume
              mountPath: /tmp/ksqldb/logs
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: ksqldb-config-pvc
        - name: logs-volume
          persistentVolumeClaim:
            claimName: ksqldb-logs-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksqldb-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksqldb-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
