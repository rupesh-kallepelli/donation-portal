apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksqldb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksqldb
  template:
    metadata:
      labels:
        app: ksqldb
    spec:
      containers:
        - name: ksqldb
          image: confluentinc/ksqldb-server:0.29.0
          ports:
            - containerPort: 8088
          volumeMounts:
            # Mount the PVC volume for configuration files and logs
            - name: config-volume
              mountPath: /etc/ksqldb
            - name: logs-volume
              mountPath: /etc/ksqldb/logs
          env:
            - name: KSQL_LISTENER
              value: "http://0.0.0.0:8088"
            - name: KSQL_KSQL_SERVICE_ID
              value: "ksql-service"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: ksqldb-config-pvc # PVC for storing config files
        - name: logs-volume
          persistentVolumeClaim:
            claimName: ksqldb-logs-pvc # PVC for storing logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksqldb-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # Adjust storage size as necessary

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksqldb-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # Adjust storage size as necessary
